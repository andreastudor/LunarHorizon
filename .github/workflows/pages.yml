name: Publish frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [e04-completare-dovezi]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    # Do not publish a broken frontend before a real public backend has been configured.
    if: vars.LUNAR_API_BASE_URL != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check public API URL
        env:
          API_URL: ${{ vars.LUNAR_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from urllib.parse import urlsplit
          url = os.environ['API_URL'].rstrip('/')
          parts = urlsplit(url)
          assert parts.scheme == 'https' and parts.hostname not in ('localhost', '127.0.0.1')
          assert not parts.username and not parts.query and not parts.fragment
          with urllib.request.urlopen(url + '/health', timeout=60) as response:
              health = json.load(response)
          assert health['status'] == 'ok' and health['kernels_loaded']
          assert len(health['dem_products']) >= 13, 'Complete terrain data must be deployed first'
          PY
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run contracts:check && npm test && npm run build
        working-directory: frontend
        env:
          LUNAR_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.LUNAR_API_BASE_URL }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
